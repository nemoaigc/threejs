<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiny Planet — Messenger style</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #b6e0ef;
      }
      body {
        font-family: "SF Pro Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        touch-action: none;
      }
      canvas { display: block; }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        color: #1a2430;
        font-size: 12.5px;
        letter-spacing: 0.02em;
        line-height: 1.55;
        opacity: 0.72;
        pointer-events: none;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 8px 14px;
      }
      #hint kbd {
        font: inherit;
        font-weight: 600;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="hint"><kbd>WASD</kbd> 行走 · 拖拽转视角 · 90 年代小镇素材台</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
