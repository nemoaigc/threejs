<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>无职转生 · 村庄切片</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #6eb6de;
      }
      body {
        font-family: "SF Pro Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        touch-action: none;
      }
      canvas { display: block; }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        color: #1a2430;
        font-size: 12.5px;
        letter-spacing: 0.02em;
        line-height: 1.55;
        opacity: 0.72;
        pointer-events: none;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 8px 14px;
      }
      #hint kbd {
        font: inherit;
        font-weight: 600;
        opacity: 0.9;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #6eb6de;
        color: #1a2430;
        font-size: 14px;
        letter-spacing: 0.04em;
        transition: opacity 0.35s ease;
      }
      #boot[data-hide="1"] {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">加载中…</div>
    <div id="hint"><kbd>WASD</kbd> 行走 · 拖拽转视角 · 英雄建筑：实几何 solid-v2</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
