<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>公会对比 · 参考图 v2 vs img2threejs</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #1a1e24; color: #e8eef4; }
    h1 { font-size: 18px; font-weight: 600; padding: 16px 20px 8px; margin: 0; }
    p { margin: 0 20px 16px; opacity: 0.8; font-size: 13px; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 24px; }
    figure { margin: 0; background: #0f1216; border-radius: 12px; overflow: hidden; border: 1px solid #2a313a; }

<body>
  <h1>冒险者公会 · 参考图（v2 规范） vs 生成 3D</h1>
  <p>

  <div class="grid">
    <figure>
      <img src="../v2/ref_three_quarter.png" alt="ref 3/4" />

    </figure>
    <figure>
      <img src="./05_3d_v2_preview.png" alt="3d v2" />

    </figure>
    <figure>
      <img src="../v2/ref_front.png" alt="ref front" />
      <figcaption><b>C. 参考 front</b></figcaption>
    </figure>
    <figure>
      <img src="../v2/ref_side.png" alt="ref side" />
      <figcaption><b>D. 参考 side</b></figcaption>
    </figure>
  </div>

</html>
